<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Does AI Need to Be Human at All?</title>
<meta name="description" content="An interactive poster by Marlus Araujo and Wenjue Yang on AI, aesthetics and creativity, with VISIONS by Orkhan Mammadov and Reveries of the Apparatus.">
<meta property="og:title" content="Does AI Need to Be Human at All?">
<meta property="og:description" content="An interactive poster by Marlus Araujo and Wenjue Yang. HKUST (Guangzhou).">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/*
  Does AI Need to Be Human at All?
  Interactive poster by Marlus Araujo and Wenjue Yang.
  Palette taken from old-master pigments: a bitumen ground, lead white,
  orpiment for agent A (the writer) and ultramarine for agent B (the drawer).
*/
:root {
  --bitumen: #14100C;
  --umber: #2A211A;
  --lead: #EEE6D3;
  --lead-dim: rgba(238, 230, 211, 0.62);
  --orpiment: #E8B23A;
  --ultra: #5A6CFF;
  --ultra-text: #9AA6FF;
  --vermilion: #D9472B;
  --u: 600px; /* poster width in px, set by script */
  --display: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bitumen); color: var(--lead); overflow: hidden; }
html { font-size: 16px; } /* set by script for each layout */
body { font-family: var(--display); -webkit-font-smoothing: antialiased; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--orpiment); outline-offset: 3px; }

#poster { position: fixed; pointer-events: none; }
#poster > * { pointer-events: auto; }
#marks { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }

/* header */
header { position: absolute; left: 6%; right: 6%; top: 2.2%; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
#ttl { font-size: 0.92rem; font-weight: 500; letter-spacing: -0.005em; color: var(--lead); text-align: left; }
.tools { display: flex; gap: 0.45rem; flex: none; }
.tool { font-family: var(--mono); font-size: 0.62rem; color: var(--lead-dim); border: 1px solid rgba(238,230,211,0.28); padding: 0.28em 0.7em; border-radius: 3px; display: inline-flex; align-items: center; gap: 0.5em; }
.tool[aria-pressed="true"] { color: var(--bitumen); background: var(--orpiment); border-color: var(--orpiment); }
.tool .glyph { display: inline-block; border: 1.5px solid currentColor; border-radius: 2px; }
#mode .glyph { width: 1.25em; height: 0.72em; transition: width 0.4s ease, height 0.4s ease; } /* shows the layout it switches to */
body.land #mode .glyph { width: 0.62em; height: 1em; }

/* agent status */
#status { position: absolute; left: 6%; right: 6%; top: 5.4%; font-family: var(--mono); font-size: 0.6rem; line-height: 1.55; color: var(--lead-dim); text-shadow: 0 0 0.6em var(--bitumen); }
#status .who { display: inline-block; width: 1.6em; font-weight: 500; }
#status .a .who { color: var(--orpiment); }
#status .b .who { color: var(--ultra-text); }
#status .live::after { content: ''; display: inline-block; width: 0.5em; height: 0.5em; margin-left: 0.5em; border-radius: 50%; background: currentColor; animation: blink 1s steps(2) infinite; vertical-align: 0.05em; }
#status .a .live::after { color: var(--orpiment); }
#status .b .live::after { color: var(--ultra-text); }

/* text panel */
#panel { position: absolute; left: 0; right: 0; bottom: 7.4%; padding: 2.2rem 6% 0.8rem; max-height: 47%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  background: linear-gradient(to top, rgba(20,16,12,0.96) 0%, rgba(20,16,12,0.9) 78%, rgba(20,16,12,0) 100%); }
#panel::-webkit-scrollbar { display: none; }
.prompt { font-family: var(--mono); font-size: 0.74rem; color: var(--orpiment); margin-bottom: 0.9rem; min-height: 1.2em; }
.stack { display: grid; }
.stack > * { grid-area: 1 / 1; }
.stack .m { font-family: var(--mono); color: var(--lead); transition: opacity 0.5s ease; }
.stack .s { opacity: 0; filter: blur(6px); transition: opacity 0.9s ease, filter 0.9s ease; }
.stack.settled .m { opacity: 0; }
.stack.settled .s { opacity: 1; filter: blur(0); }
.head .m { font-size: 1.22rem; line-height: 1.3; }
.head .s { font-size: 1.66rem; line-height: 1.12; font-weight: 500; letter-spacing: -0.025em; }
.body { margin-top: 0.9rem; }
.body .m { font-size: 0.8rem; line-height: 1.55; color: var(--lead-dim); }
.body .s { font-size: 0.96rem; line-height: 1.5; color: rgba(238,230,211,0.86); max-width: 34em; }
.statement { margin-top: 1rem; }
.statement .m { font-size: 0.9rem; line-height: 1.45; color: var(--orpiment); }
.statement .s { font-size: 1.2rem; line-height: 1.25; font-weight: 400; letter-spacing: -0.01em; color: var(--orpiment); }
.byline { margin-top: 1rem; }
.byline .m, .byline .s { font-size: 0.78rem; }
.byline .s { font-family: var(--mono); color: var(--lead-dim); filter: none; }
.typing::after { content: ''; display: inline-block; width: 0.55em; height: 1em; margin-left: 0.08em; background: var(--orpiment); vertical-align: -0.12em; animation: blink 0.8s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.hint { margin-top: 1.1rem; font-family: var(--mono); font-size: 0.66rem; color: var(--ultra-text); opacity: 0; transition: opacity 0.6s ease; }
.hint.on { opacity: 1; }
.thread { margin-top: 0.6rem; }
.ex { margin-top: 1.1rem; }
.ex .q { font-family: var(--mono); font-size: 0.7rem; color: var(--orpiment); margin-bottom: 0.45rem; }
.ex .stack .m { font-size: 0.76rem; line-height: 1.55; color: var(--lead-dim); }
.ex .stack .s { font-size: 0.95rem; line-height: 1.5; color: rgba(238,230,211,0.86); max-width: 34em; }
.asks { margin-top: 1.2rem; display: flex; flex-wrap: wrap; gap: 0.5rem; opacity: 0; transform: translateY(0.4rem); transition: opacity 0.6s ease, transform 0.6s ease; }
.asks.on { opacity: 1; transform: none; }
.ask { font-family: var(--mono); font-size: 0.68rem; color: var(--lead); padding: 0.55em 0.85em; border: 1px solid rgba(154,166,255,0.55); border-radius: 3px; text-align: left; }
.ask::before { content: '› '; color: var(--ultra-text); }
.ask:active { background: rgba(90,108,255,0.18); }
.ask.poll { border-color: rgba(232,178,58,0.6); }
.ask.poll::before { color: var(--orpiment); }
.pollres { margin-top: 0.8rem; font-family: var(--mono); font-size: 0.62rem; color: var(--lead-dim); display: grid; grid-template-columns: auto 1fr auto; gap: 0.35rem 0.7rem; align-items: center; }
.pollres .bar { height: 0.45rem; background: var(--orpiment); border-radius: 1px; transition: width 0.8s ease; }
.source { margin-top: 1.1rem; font-family: var(--mono); font-size: 0.56rem; color: rgba(238,230,211,0.45); opacity: 0; transition: opacity 0.6s ease; }
.source.on { opacity: 1; }

/* navigation */
nav { position: absolute; left: 6%; right: 6%; bottom: 2%; height: 4.2%; display: flex; align-items: center; gap: 0.7rem; }
nav .step { color: var(--lead); width: 2.3rem; height: 100%; min-height: 2.1rem; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(238,230,211,0.28); border-radius: 3px; flex: none; }
nav .step svg { width: 1.05rem; height: 1.05rem; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
nav .step:active { background: rgba(238,230,211,0.1); }
#ticks button .nm { display: none; }
#ticks { flex: 1; display: flex; gap: 3px; align-items: center; height: 100%; }
#ticks button { flex: 1; height: 100%; position: relative; }
#ticks button::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; background: rgba(238,230,211,0.22); transition: background 0.3s, height 0.3s; }
#ticks button.seen::after { background: rgba(238,230,211,0.5); }
#ticks button.cur::after { background: var(--orpiment); height: 4px; margin-top: -1px; }
#where { position: absolute; left: 6%; right: 6%; bottom: 6.3%; font-family: var(--mono); font-size: 0.56rem; color: rgba(238,230,211,0.45); pointer-events: none; display: flex; justify-content: space-between; }

/* marks drawn over the particle formations */
.mk { position: absolute; font-family: var(--mono); font-size: 0.6rem; line-height: 1.3; color: var(--lead); opacity: 0; transition: opacity 0.7s ease; white-space: nowrap; pointer-events: none; text-shadow: 0 0 0.5em rgba(20,16,12,0.95), 0 0 1em rgba(20,16,12,0.8); }
.mk.on { opacity: 1; }
.mk.box { border: 1.5px solid var(--ultra); white-space: normal; }
.mk.box span { position: absolute; left: -1.5px; top: 0; transform: translateY(-100%); background: var(--ultra); color: #fff; padding: 0.15em 0.45em; white-space: nowrap; }
.mk.quad { color: var(--lead); background: rgba(20,16,12,0.7); padding: 0.2em 0.45em; }
.mk.quad.act { color: var(--bitumen); background: var(--orpiment); }
.mk .vis { color: var(--orpiment); font-weight: 500; }
.mk.quad.act .vis { color: var(--bitumen); }
.mk.chip { padding: 0.2em 0.5em; border-radius: 2px; background: rgba(20,16,12,0.78); border: 1px solid rgba(238,230,211,0.4); color: var(--lead-dim); }
.mk.chip.l1 { background: var(--orpiment); border-color: var(--orpiment); color: var(--bitumen); }
.mk.chip.l2 { background: var(--ultra); border-color: var(--ultra); color: #fff; }
.mk.chip.l3 { background: rgba(20,16,12,0.78); border-color: var(--lead); color: var(--lead); }
.mk.node { font-family: var(--display); font-weight: 500; font-size: 0.9rem; color: var(--lead); transform: translate(-50%, -50%); text-align: center; text-shadow: 0 0 0.6em rgba(20,16,12,0.9); }
.mk.agent { font-size: 0.62rem; transform: translate(-50%, 0); text-align: center; }
.mk.agent.a { color: var(--orpiment); }
.mk.agent.b { color: var(--ultra-text); }
.mk.cap { font-family: var(--display); font-size: 0.85rem; color: var(--lead-dim); transform: translateX(-50%); }
.media { position: absolute; object-fit: cover; border-radius: 2px; opacity: 0; transition: opacity 1s ease; box-shadow: 0 0 0 1px rgba(238,230,211,0.2); }
.media.on { opacity: 1; }

/* Reveries: the frame, the bust's display and the agents' notes */
.mk.frame { border: 2px solid #B8913E; box-shadow: 0 0 0 5px rgba(20,16,12,0.9), 0 0 0 7px rgba(184,145,62,0.55), 0 1.2em 3em rgba(0,0,0,0.6); }
.mk.corners { --c: rgba(238,230,211,0.55); --l: 1.1rem;
  background: linear-gradient(var(--c),var(--c)) top left / var(--l) 1px, linear-gradient(var(--c),var(--c)) top left / 1px var(--l),
    linear-gradient(var(--c),var(--c)) top right / var(--l) 1px, linear-gradient(var(--c),var(--c)) top right / 1px var(--l),
    linear-gradient(var(--c),var(--c)) bottom left / var(--l) 1px, linear-gradient(var(--c),var(--c)) bottom left / 1px var(--l),
    linear-gradient(var(--c),var(--c)) bottom right / var(--l) 1px, linear-gradient(var(--c),var(--c)) bottom right / 1px var(--l); background-repeat: no-repeat; }
.mk.qr { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3em; transform: translate(-100%, -100%); text-align: right; font-size: 0.5rem; color: var(--lead-dim); }
.mk.qr .code { border-radius: 3px; overflow: hidden; margin-bottom: 0.35em; box-shadow: 0 0 0 1px rgba(238,230,211,0.25); }
.mk.qr .code svg { display: block; width: 100%; height: 100%; }
.mk.qr .t span { display: block; } .mk.qr .u { color: rgba(238,230,211,0.45); }
body:not(.land) .mk.qr { flex-direction: row-reverse; align-items: flex-end; gap: 0.9em; transform: translate(-100%, 0); }
body:not(.land) .mk.qr .code { margin-bottom: 0; }
body:not(.land) .mk.qr .t span + span { margin-top: 0.3em; }
.mk.cap2 { font-size: 0.5rem; line-height: 1.45; white-space: normal; }
.mk.cap2 b { display: block; font-weight: 500; font-size: 0.56rem; margin-bottom: 0.35em; }
.mk.cap2.a { color: var(--orpiment); text-align: right; } .mk.cap2.a p { color: rgba(232,178,58,0.82); }
.mk.cap2.b { color: var(--ultra-text); } .mk.cap2.b p { color: rgba(154,166,255,0.85); }
.mk.applog { font-size: 0.5rem; line-height: 1.45; white-space: normal; padding: 0.7em 0.9em; background: linear-gradient(to bottom, rgba(20,16,12,0.78), rgba(20,16,12,0.45) 80%, rgba(20,16,12,0)); }
.applog p { min-height: 1.45em; }
.applog .th { color: var(--orpiment); }
.applog .im { color: var(--ultra-text); opacity: 0.92; }
.applog .old { opacity: 0.45; }
.mk.vfdwrap { padding: 2px; background: #173a2c; border-radius: 2px; box-shadow: 0 0 0 2px rgba(205,196,180,0.55), inset 0 0 0 1px rgba(0,0,0,0.5), 0 0 1.6em rgba(80,240,210,0.16); }
.vfdwrap canvas { display: block; width: 100%; height: 100%; border-radius: 2px; }
.mk.tagA { color: var(--orpiment); font-size: 0.52rem; }
.mk.say { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; line-height: 0.98; color: #F7F4EE; text-align: center; white-space: normal;
  text-shadow: 0 0.04em 0.5em rgba(20,16,12,0.55); opacity: 0; transform: translateY(0.3em); transition: opacity 0.9s ease, transform 0.9s ease; }
.mk.say.on.show { opacity: 1; transform: none; }
.mk.tagB { color: var(--ultra-text); font-size: 0.52rem; }
.ask.link { text-decoration: none; display: inline-block; color: var(--bitumen); background: var(--orpiment); border-color: var(--orpiment); }
.ask.link::before { content: '↗ '; color: var(--bitumen); }
.acts { display: flex; flex-wrap: wrap; gap: 0.5rem; width: 100%; margin-bottom: 0.35rem; }
.ask.photos { border-color: rgba(232,178,58,0.6); }

/* photo viewer */
#lightbox { position: fixed; inset: 0; z-index: 6; background: rgba(12,10,8,0.94); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 4vmin; gap: 1.2rem; }
#lightbox.on { display: flex; }
#lightbox img, #lightbox video { max-width: 100%; max-height: 74vh; object-fit: contain; box-shadow: 0 1.5em 4em rgba(0,0,0,0.6); }
#lightbox .cap { font-family: var(--mono); font-size: 0.66rem; color: var(--lead-dim); text-align: center; max-width: 40em; }
#lightbox .row { display: flex; gap: 0.6rem; align-items: center; }
#lightbox .lb { font-family: var(--mono); font-size: 0.66rem; color: var(--lead); border: 1px solid rgba(238,230,211,0.35); padding: 0.55em 0.9em; border-radius: 3px; }
#lightbox .count { font-family: var(--mono); font-size: 0.6rem; color: rgba(238,230,211,0.45); min-width: 4em; text-align: center; }

/* opening card */
#intro { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(20,16,12,0.72); z-index: 5; transition: opacity 0.9s ease; cursor: pointer; }
#intro.off { opacity: 0; pointer-events: none; }
#intro .card { width: min(84vw, 47vh); text-align: left; }
#intro h1 { font-family: var(--display); font-weight: 600; font-size: 2.7rem; line-height: 1.0; letter-spacing: -0.035em; }
#intro p { margin-top: 1.4em; font-family: var(--mono); font-size: 0.72rem; line-height: 1.6; color: var(--lead-dim); }
#intro p b { font-weight: 500; }
#intro .a { color: var(--orpiment); }
#intro .b { color: var(--ultra-text); }
#intro .go { margin-top: 2em; display: inline-block; font-family: var(--mono); font-size: 0.78rem; color: var(--bitumen); background: var(--orpiment); padding: 0.6em 1em; border-radius: 3px; }
body.land #intro .card { width: min(70vw, 34em); }

/* landscape: the field on the left, the agents' text on the right */
#scrim { position: absolute; top: 0; bottom: 0; right: 0; width: 50%; pointer-events: none; display: none;
  background: linear-gradient(to right, rgba(20,16,12,0) 0%, rgba(20,16,12,0.86) 16%, rgba(20,16,12,0.94) 100%); }
body.land #scrim { display: block; }
body.land header { left: 3.5%; right: 3.5%; top: 4.2%; }
body.land #ttl { font-size: 1.05rem; }
body.land #status { left: 3.5%; right: auto; width: 48%; top: 9.2%; }
body.land #panel { left: 55%; right: 3.5%; top: 15%; bottom: 13.5%; max-height: none; padding: 0 0 1rem; background: none; }
body.land .head .s { font-size: 1.85rem; }
body.land #where { display: none; }
body.land nav { left: 3.5%; right: 3.5%; bottom: 3.2%; height: 7.4%; gap: 1rem; align-items: stretch; }
body.land nav .step { height: auto; }
body.land #ticks { gap: 6px; align-items: stretch; }
body.land #ticks button::after { top: 0.9rem; }
body.land #ticks button .nm { display: block; position: absolute; left: 0; right: 0; top: 1.5rem; font-family: var(--mono); font-size: 0.5rem; text-align: left; color: rgba(238,230,211,0.32); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s; }
body.land #ticks button.seen .nm { color: rgba(238,230,211,0.55); }
body.land #ticks button.cur .nm { color: var(--orpiment); }

@media (prefers-reduced-motion: reduce) {
  .stack .s, .stack .m, .asks, .hint, .mk { transition: none; }
  .typing::after, #status .live::after { animation: none; }
}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<div id="poster">
  <div id="scrim"></div>
  <header>
    <button id="ttl" aria-label="Go to the project chapter">Does AI need to be human at all?</button>
    <div class="tools">
      <button class="tool" id="mode" aria-label="Switch to landscape layout"><span class="glyph" aria-hidden="true"></span><span class="lbl">Landscape</span></button>
      <button class="tool" id="auto" aria-pressed="false" aria-label="Play chapters automatically">Auto</button>
    </div>
  </header>
  <div id="status" aria-hidden="true">
    <div class="a"><span class="who">A</span><span class="txt">is listening</span></div>
    <div class="b"><span class="who">B</span><span class="txt">is resting</span></div>
  </div>
  <div id="marks"></div>
  <section id="panel" aria-live="off"></section>
  <div id="where"><span id="whereName"></span><span id="whereNum"></span></div>
  <nav aria-label="Chapters">
    <button class="step" id="prev" aria-label="Previous chapter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
    <div id="ticks"></div>
    <button class="step" id="next" aria-label="Next chapter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg></button>
  </nav>
</div>

<div id="lightbox" role="dialog" aria-label="Photographs" aria-modal="true">
  <div class="media-slot"></div>
  <p class="cap"></p>
  <div class="row"><button class="lb" id="lbPrev">Previous</button><span class="count"></span><button class="lb" id="lbNext">Next</button><button class="lb" id="lbClose">Close</button></div>
</div>

<div id="intro" role="dialog" aria-label="Introduction">
  <div class="card">
    <h1>Does AI need to be human at all?</h1>
    <p>Two agents narrate this poster.<br><b class="a">A</b> writes. <b class="b">B</b> draws.<br>Every line they write was written by Marlus Araujo and Wenjue Yang.</p>
    <button class="go" id="go">Touch to begin</button>
  </div>
</div>

<script>
'use strict';

/* ------------------------------------------------------------------
   SETTINGS: edit these when the poster moves to GitHub.
   MEDIA paths are relative to this file, for example 'media/visions.mp4'.
   visions         optional video or image: the painting's particles take their colours from it.
   visionsLink     the VISIONS series online, opened by the button in chapter 1.
   reveriesPhotos  photographs shown by “See the sculpture” in the Reveries chapter.
------------------------------------------------------------------- */
const MEDIA = {
  visions: '',
  visionsLink: 'https://verse.works/series/visions-by-orkhan',
  // the public address of this poster; the QR code below encodes it (regenerate both together)
  posterUrl: 'https://archive.marlus.com/does-ai-need-to-be-human/',
  reveriesPhotos: [
    ['media/reveries-face.jpg', 'The face: a hemisphere hollowed out, with a vacuum fluorescent display inside.'],
    ['media/reveries-concept.jpg', 'Concept image: the bust contemplating the image the machine generates.'],
    ['media/reveries-screen.jpg', 'The image agent at work: a sentence, a prompt, a marble picture.'],
    ['media/reveries-workshop.jpg', 'The bust in the workshop.'],
  ],
};

/* Sentences replayed on the poster's display. The first sentence and its notes,

  { id: 'mind', nav: 'A mind', form: 'swarm', prompt: 'why do we see a mind?',
    head: 'Techno-animism and the Pygmalion effect.',
    body: 'We readily attribute a mind or intention to things that seem to act: spirits in rivers and storms, a sculptor in love with the statue he carved, a machine that seems to intend its images. This challenges familiar assumptions about authorship and creativity.',

  { id: 'practices', nav: 'Human practices', form: 'mosaic', prompt: 'where does AI creativity come from?',
    head: 'Yet AI creativity depends on human and cultural practices.',
    body: 'Training datasets draw on accumulated knowledge, artistic traditions and cultural histories. Machine Decision Is Not Final approaches AI through diverse cultural, historical and practical perspectives.',

const VS = `
precision highp float;
attribute vec2 aFrom; attribute vec2 aTo; attribute vec3 aCF; attribute vec3 aCT; attribute float aSeed; attribute float aRoute; attribute float aSF; attribute float aST;
uniform float uT, uT0, uDur, uDrift, uSize, uDpr, uFlow, uSpeed, uAtt, uK, uFT0;
uniform vec3 uCol; uniform vec2 uRes; uniform vec3 uPtr; uniform vec4 uTap;
uniform vec2 uA0, uB0, uC0, uA1, uB1, uC1, uA2, uB2, uC2;
varying vec3 vCol;
float ease(float x){ return x < 0.5 ? 4.0*x*x*x : 1.0 - pow(-2.0*x + 2.0, 3.0)/2.0; }
void main(){

}

async function enter(c) {
  runId++; skipping = false; const id = runId; typingNow = true; doneAt = 0;
  panel.innerHTML = ''; panel.scrollTop = 0;
  const pr = document.createElement('p'); pr.className = 'prompt';
  const hd = stackEl('head', c.head);
  panel.append(pr, hd);
  let bd, st, by;
  if (c.body) { bd = stackEl('body', c.body); panel.append(bd); }
  if (c.statement) { st = stackEl('statement', c.statement); panel.append(st); }
  if (c.byline) { by = stackEl('byline', c.byline); panel.append(by); }
  const hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = c.hint || '';
  const thread = document.createElement('div'); thread.className = 'thread';
  const asks = document.createElement('div'); asks.className = 'asks';
  const src = document.createElement('p'); src.className = 'source'; src.textContent = c.source || '';
  if (c.hint) panel.append(hint);
  panel.append(thread, asks);
  if (c.source) panel.append(src);
  buildAsks(c, asks, thread);
  try {
    setA('is reading the prompt', true);
    await wait(500, id);
    await type(pr, '› ' + c.prompt, 34, id);
    setA('is writing', true);
    await wait(350, id);
    await typeStack(hd, c.head, 46, id);
    if (bd) await typeStack(bd, c.body, 95, id);
    if (st) { await wait(300, id); await typeStack(st, c.statement, 50, id); }
    if (by) await typeStack(by, c.byline, 70, id);
    hint.classList.add('on'); asks.classList.add('on'); src.classList.add('on');
    setA('is listening', false);
    typingNow = false; doneAt = performance.now();
  } catch (e) { if (e !== STOP) console.error(e); }
}

let askQueue = Promise.resolve();
function say(thread, q, a) {
  const id = runId;
  askQueue = askQueue.then(async () => {
    if (id !== runId) return;
    skipping = false; typingNow = true; doneAt = 0;
    const ex = document.createElement('div'); ex.className = 'ex';
    const qq = document.createElement('p'); qq.className = 'q';
    const st = stackEl('', a);
    ex.append(qq); if (a) ex.append(st); thread.append(ex);
    try {
      setA('is reading your question', true);
      if (q) await type(qq, '› ' + q, 40, id);
      setA('is writing', true);
      ex.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
      if (a) await typeStack(st, a, 90, id);
      setA('is listening', false); ex.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' });
    } catch (e) { if (e !== STOP) console.error(e); }
    typingNow = false; doneAt = performance.now();
  });
  return askQueue;
}
function buildAsks(c, asks, thread) {
  if (c.poll) {
    const lab = document.createElement('p'); lab.className = 'prompt'; lab.style.width = '100%'; lab.style.margin = '0'; lab.textContent = c.poll.q; asks.append(lab);
    c.poll.opts.forEach((o, k) => {
      const b = document.createElement('button'); b.className = 'ask poll'; b.textContent = o[0];
      b.onclick = () => { vote(k); [...asks.querySelectorAll('.poll')].forEach(x => x.remove()); lab.remove(); showPoll(c, thread); say(thread, null, o[1]); };
      asks.append(b);
    });
  }
  const acts = document.createElement('div'); acts.className = 'acts';
  if (c.link && MEDIA[c.link[1]]) {
    const a = document.createElement('a'); a.className = 'ask link'; a.textContent = c.link[0]; a.href = MEDIA[c.link[1]]; a.target = '_blank'; a.rel = 'noopener';
    acts.append(a);
  }
  if (c.photos && MEDIA.reveriesPhotos && MEDIA.reveriesPhotos.length) {
    const b = document.createElement('button'); b.className = 'ask photos'; b.textContent = c.photos; b.onclick = () => openLightbox(MEDIA.reveriesPhotos, 0); acts.append(b);
  }
  if (acts.children.length) asks.append(acts);
  (c.asks || []).forEach(([q, a]) => {
    const b = document.createElement('button'); b.className = 'ask'; b.textContent = q;
    b.onclick = () => { b.remove(); if (a === null) { go(0); return; } say(thread, q, a); };
    asks.append(b);
  });
}

/* the poll keeps its tally on this screen only */
function tally() { try { return JSON.parse(localStorage.getItem('aihuman-poll') || '[0,0,0]'); } catch (e) { return [0, 0, 0]; } }
function vote(k) { const t = tally(); t[k]++; try { localStorage.setItem('aihuman-poll', JSON.stringify(t)); } catch (e) {} }
function showPoll(c, thread) {
  const t = tally(), max = Math.max(1, ...t), g = document.createElement('div'); g.className = 'pollres';
  c.poll.opts.forEach((o, k) => {
    const a = document.createElement('span'); a.textContent = o[0];
    const wrap = document.createElement('span'); const bar = document.createElement('span'); bar.className = 'bar'; bar.style.display = 'block'; bar.style.width = '0%'; wrap.append(bar);
    const n = document.createElement('span'); n.textContent = t[k];
    g.append(a, wrap, n); requestAnimationFrame(() => requestAnimationFrame(() => bar.style.width = (t[k] / max * 100) + '%'));
  });
  const note = document.createElement('p'); note.className = 'source on'; note.textContent = 'Answers given on this screen.';
  thread.append(g, note);
}

/* ------------------------------------------------------------------
   Touch and pointer
------------------------------------------------------------------- */
let down = null, lastInput = performance.now();
function inUI(el) { return !!(el && el.closest && el.closest('#panel, nav, header, #intro, #lightbox, button, a')) || (mode === 'landscape' && el && el.id === 'scrim'); }
addEventListener('pointerdown', e => {
  lastInput = performance.now(); if (autoOn && CONFIG.idleAutoplaySeconds) setAuto(false);
  if (inUI(e.target)) return;
  const [x, y] = toUnits(e.clientX, e.clientY);
  down = { x: e.clientX, y: e.clientY, t: performance.now(), ux: x, uy: y };
  ptr.x = x; ptr.y = y; ptr.sT = 1; ptr.down = true;
});
addEventListener('pointermove', e => {
  const [x, y] = toUnits(e.clientX, e.clientY); ptr.x = x; ptr.y = y;
  if (!ptr.down) ptr.sT = e.pointerType === 'mouse' && !inUI(e.target) ? 0.55 : 0;
  if (ptr.down && CH[cur] && CH[cur].form === 'swarm') {
    dragTime += 1 / 60;
    if (dragTime > 1.4 && !reacted && !typingNow) { reacted = true; say(panel.querySelector('.thread'), null, CH[cur].react); }
  }
});
addEventListener('pointerup', e => {
  ptr.down = false; ptr.sT = 0;
  if (!down) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, dt = performance.now() - down.t;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5 && dt < 500) { go(cur + (dx < 0 ? 1 : -1)); down = null; return; }
  if (Math.hypot(dx, dy) < 12 && dt < 450) onTap(down.ux, down.uy);
  down = null;
});
addEventListener('pointercancel', () => { ptr.down = false; ptr.sT = 0; down = null; });
panel.addEventListener('click', e => { if (!e.target.closest('button') && typingNow) skipping = true; lastInput = performance.now(); });

function inside(R, x, y) { return x >= R.x0 && x <= R.x0 + R.w && y >= R.y0 && y <= R.y0 + R.h; }
function onTap(x, y) {
  const c = CH[cur]; if (!c) return;
  tap = [x, y, now(), 0.12 * K];
  if (c.form === 'painting' && paintRect && inside(paintRect, x, y)) {
    const u = (x - paintRect.x0) / paintRect.w * PW, v = (y - paintRect.y0) / paintRect.h * PH;
    let r = regions.find(R => u >= R.x && u <= R.x + R.w && v >= R.y && v <= R.y + R.h);
    if (!r) r = regions.reduce((a, R) => Math.hypot(R.x + R.w / 2 - u, R.y + R.h / 2 - v) < Math.hypot(a.x + a.w / 2 - u, a.y + a.h / 2 - v) ? R : a);
    if (!visMedia) { const old = regenerate(r); samplePainting(A.aCT, r); samplePainting(A.aCF, r); recolor(); box(r, `${old} → ${r.n}`, 3000); }
    else box(r, `${r.n} ${(0.7 + rnd() * 0.28).toFixed(2)}`, 2400);
    tap[3] = 0.2 * K;
  }
  if (c.form === 'quad') {
    const k = quadRects.findIndex(R => inside(R, x, y));
    if (k >= 0 && k !== quadOn) {
      quadOn = k; marks.querySelectorAll('.mk.quad').forEach(m => m.classList.toggle('act', +m.dataset.k === k));
      say(panel.querySelector('.thread'), c.quads[k][0].toLowerCase(), c.quads[k][1]);
    }
  }
  if (c.form === 'tiles') {
    const k = tileRects.findIndex(R => inside(R, x, y));
    if (k >= 0) {
      tileLabels[k] = tileLabels[k] % 3 + 1; labelsGiven++;
      const m = marks.querySelector(`.mk.chip[data-k="${k}"]`);
      if (m) { m.className = 'mk chip on l' + tileLabels[k]; m.textContent = tileLabelText(k); }
      if (labelsGiven >= 3 && !reacted && !typingNow) { reacted = true; say(panel.querySelector('.thread'), null, c.react); }
    }
  }
  if (c.form === 'strata') {
    const o = strataOrder.slice(); for (let k = o.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [o[k], o[j]] = [o[j], o[k]]; }
    strataOrder = o; morphTo('strata', 1.8);
  }
  if (c.form === 'apparatus' && app && app.G && inside(app.G.frame, x, y)) { appSkip = true; tap[3] = 0.25 * K; }
  if (c.form === 'triad') {
    const k = triadNodes.findIndex(n => Math.hypot(n.x - x, n.y - y) < n.r * 1.4);
    if (k >= 0) say(panel.querySelector('.thread'), c.nodes[k][0], c.nodes[k][1]);
  }
}

/* photo viewer */
const lbox = $('#lightbox'); let lbItems = [], lbI = 0;
function showLb() {
  const [src, cap] = lbItems[lbI], slot = lbox.querySelector('.media-slot');
  slot.innerHTML = ''; const el = mediaEl(src); if (el) { el.alt = cap; if (el.tagName === 'VIDEO') { el.controls = true; el.play && el.play().catch(() => {}); } slot.append(el); }
  lbox.querySelector('.cap').textContent = cap; lbox.querySelector('.count').textContent = `${lbI + 1} of ${lbItems.length}`;
  $('#lbPrev').style.visibility = $('#lbNext').style.visibility = lbItems.length > 1 ? 'visible' : 'hidden';
}
function openLightbox(items, i) { lbItems = items; lbI = i; showLb(); lbox.classList.add('on'); $('#lbClose').focus(); }
function closeLightbox() { lbox.classList.remove('on'); lbox.querySelector('.media-slot').innerHTML = ''; }
$('#lbPrev').onclick = () => { lbI = (lbI + lbItems.length - 1) % lbItems.length; showLb(); };
$('#lbNext').onclick = () => { lbI = (lbI + 1) % lbItems.length; showLb(); };
$('#lbClose').onclick = closeLightbox;
lbox.addEventListener('click', e => { if (e.target === lbox) closeLightbox(); });

/* keys: arrows, space, A for Auto, L for landscape or portrait, F for full screen */
addEventListener('keydown', e => {
  lastInput = performance.now();
  if (lbox.classList.contains('on')) {
    if (e.key === 'Escape') closeLightbox(); else if (e.key === 'ArrowRight') $('#lbNext').click(); else if (e.key === 'ArrowLeft') $('#lbPrev').click();
    e.preventDefault(); return;
  }
  if (!introGone) { startPoster(); return; }
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); if (typingNow) skipping = true; else go(cur + 1); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
  else if (e.key === 'a' || e.key === 'A') setAuto(!autoOn);
  else if (e.key === 'l' || e.key === 'L') setMode(mode === 'portrait' ? 'landscape' : 'portrait');
  else if (e.key === 'f' || e.key === 'F') { const d = document.documentElement; try { (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen()).catch(() => {}); } catch (err) {} }
});
$('#next').onclick = () => go(cur + 1);
$('#prev').onclick = () => go(cur - 1);
$('#ttl').onclick = () => go(2);

/* Auto mode */
let autoOn = false;
function setAuto(on) { autoOn = on; $('#auto').setAttribute('aria-pressed', on ? 'true' : 'false'); $('#auto').textContent = on ? 'Auto on' : 'Auto'; }
$('#auto').onclick = () => setAuto(!autoOn);
setInterval(() => {
  const t = performance.now();
  if (!autoOn && CONFIG.idleAutoplaySeconds && introGone && t - lastInput > CONFIG.idleAutoplaySeconds * 1000) setAuto(true);
  if (autoOn && doneAt && !typingNow && t - doneAt > CONFIG.autoSeconds * 1000) go(cur + 1);
}, 400);

/* ------------------------------------------------------------------
   Start
------------------------------------------------------------------- */
function resize(dur = 1.4) {
  const oldCol = { ...col };
  layout();
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (cur >= 0) { morphTo(CH[cur].form, dur, oldCol); buildMarks(CH[cur]); }
}
function setMode(m) {
  modeChoice = m; try { localStorage.setItem('aihuman-mode', m); } catch (e) {}
  resize(1.8);
}
$('#mode').onclick = () => setMode(mode === 'portrait' ? 'landscape' : 'portrait');
let introGone = false;
function startPoster() {
  if (introGone) return; introGone = true; $('#intro').classList.add('off'); lastInput = performance.now();
  const h = location.hash.slice(1), k = CH.findIndex(c => c.id === h);
  go(k >= 0 ? k : 0);
}

(async function boot() {
  layout(); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  paintBase();
  try { initGL(); } catch (e) { console.error(e); }
  allocate();
  loadHead();
  vis.size = vis.sizeT = 2.2; vis.drift = vis.driftT = 0.02;
  tr = { t0: now() - 99, ft0: 0, dur: 2.4, flow: 0, routes: null, speed: 0.12, name: 'swarm' };
  requestAnimationFrame(frame);
  if (MEDIA.visions) { visMedia = mediaEl(MEDIA.visions); if (visMedia && visMedia.play) visMedia.play().catch(() => {}); }
  try {
    await Promise.race([Promise.all([
      document.fonts.load('600 120px "Space Grotesk"'), document.fonts.load('500 120px "Space Grotesk"'),
      document.fonts.load('400 20px "IBM Plex Mono"'), document.fonts.load('600 120px "Noto Serif SC"', '人工智能'),
    ]), new Promise(r => setTimeout(r, 2500))]);
  } catch (e) {}
  addEventListener('resize', () => { clearTimeout(resize.t); resize.t = setTimeout(() => resize(1.2), 150); });
  $('#go').onclick = startPoster; $('#intro').addEventListener('click', startPoster);
  setTimeout(startPoster, reduced ? 1500 : 6000);
})();
</script>
